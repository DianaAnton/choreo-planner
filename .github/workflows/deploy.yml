name: Deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation
  pull-requests: write # required to comment the preview URL

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          # Firebase web config is public by design — it ships in the bundle and
          # security rules are what actually protect data. Repo *variables*,
          # not secrets, so PRs from this repo can build normally.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  preview:
    name: Preview channel
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy preview channel
        id: deploy
        run: |
          npm install -g firebase-tools
          # Channel expires so abandoned PRs don't accumulate live URLs.
          url=$(firebase hosting:channel:deploy "pr-${{ github.event.number }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --expires 7d \
            --json | jq -r '.result[].url')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            ### 🪩 Preview deployed
            ${{ steps.deploy.outputs.url }}

            Expires in 7 days · commit `${{ github.sha }}`

  production:
    name: Production
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Requires manual approval — configure reviewers on the `production`
    # environment in repo settings. See docs/firebase-setup.md step 7.
    environment:
      name: production
      url: https://${{ vars.GCP_PROJECT_ID }}.web.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy hosting, rules and indexes
        run: |
          npm install -g firebase-tools
          firebase deploy \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --only hosting,firestore:rules,firestore:indexes \
            --non-interactive \
            --message "${{ github.sha }}"
